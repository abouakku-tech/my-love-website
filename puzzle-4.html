<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Love Puzzle</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#ffd6e7,#fff5f8);text-align:center}
#board{width:306px;height:306px;margin:20px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.tile{width:100px;height:100px;background-image:url('puzzle.png');background-size:300px 300px;border:2px solid #fff;border-radius:10px;cursor:pointer}
button,a{padding:10px 20px;border:none;border-radius:20px;background:#e91e63;color:#fff;text-decoration:none;margin:8px;display:inline-block}
</style></head><body>
<h1>🧩 Our Love Puzzle ❤️</h1>
<p>Tap one tile, then another to swap.</p>
<div>Moves: <span id='moves'>0</span></div>
<div id='board'></div>
<button onclick='shuffle()'>Shuffle</button><a href='index.html'>Back</a>
<script>
const b=document.getElementById('board');let p=[],f=null,m=0;
for(let r=0;r<3;r++)for(let c=0;c<3;c++)p.push({x:c,y:r});
function d(){b.innerHTML='';p.forEach((e,i)=>{let x=document.createElement('div');x.className='tile';x.style.backgroundPosition=(-e.x*100)+'px '+(-e.y*100)+'px';x.dataset.i=i;x.onclick=s;b.appendChild(x)});w()}
function s(){if(f==null){f=this.dataset.i;this.style.border='4px solid red'}else{let t=this.dataset.i;[p[f],p[t]]=[p[t],p[f]];f=null;m++;moves.textContent=m;d()}}
function shuffle(){for(let i=p.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}m=0;moves.textContent=0;d()}
function w(){let ok=true;for(let i=0;i<p.length;i++){if(p[i].x!=i%3||p[i].y!=Math.floor(i/3))ok=false}if(ok&&m>0)setTimeout(()=>alert('❤️ Congratulations! You solved our love puzzle! ❤️'),200)}
d();
</script></body></html>
